# Disposable, de-identified demonstration. No durable storage or GPU inference.
services:
  - type: web
    name: oncometra-demo
    runtime: python
    plan: free
    region: oregon
    branch: codex/oncometra-demo
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn app.oncometra:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: APP_STORAGE_ROOT
        value: /tmp/oncometra-demo
      - key: DEMO_EPHEMERAL
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: ONCOMETRA_ADMIN_PASSWORD
        generateValue: true
      - key: ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
